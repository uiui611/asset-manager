# main のイメージを GHCR に公開し、その後で更新 webhook を通知します。
# 通知失敗は警告として扱い、Pod の更新完了は待ちません。
name: Check, publish and deploy container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/uiui611/asset-manager

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run schemas
      - run: bun run check:ci
      - run: bun run test
      - run: bun run build
      - name: Install test browsers
        run: bunx playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      - run: bun run test:e2e
      - name: Save failed browser test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  backend:
    name: Check Rust backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo test --manifest-path backend/Cargo.toml --locked

  build:
    name: Validate pull request image
    if: github.event_name == 'pull_request'
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false

  publish:
    name: Publish main image and request deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ghcr-asset-manager-main
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=asset-manager-main
          cache-to: type=gha,mode=max,scope=asset-manager-main
      - name: Request deployment update
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOY_SERVICE_ID: asset-manager
          DEPLOY_WEBHOOK_URL: https://deploy.mizu-mizu.info/v1/deployments
          DEPLOY_OIDC_AUDIENCE: https://deploy.mizu-mizu.info
        run: node .github/scripts/notify-deployment.mjs
