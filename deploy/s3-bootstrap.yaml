# Overview: one-time, bucket-scoped RustFS service account provisioning.
# Prerequisites: default/rustfs-credentials and default/asset-manager-credentials Secrets.
# Secret values are never printed. Requires RustFS MinIO admin compatibility.
# Verify: Job Complete; assets bucket is accessible using scoped credentials.
# Existing buckets and policies are retained. Root credentials are used only by this bootstrap Job.
apiVersion: v1
kind: ConfigMap
metadata: {name: asset-manager-s3-policy, namespace: default}
data:
  policy.json: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::assets"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::assets/*"]}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: asset-manager-s3-bootstrap-v6, namespace: default}
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: setup
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: [/bin/sh, -ec]
          args:
            - |
              run() {
                output=$("$@" 2>&1) || {
                  output=${output//"$RUSTFS_ACCESS_KEY"/[redacted]}
                  output=${output//"$RUSTFS_SECRET_KEY"/[redacted]}
                  output=${output//"$S3_ACCESS_KEY"/[redacted]}
                  output=${output//"$S3_SECRET_KEY"/[redacted]}
                  printf '%s\n' "$output"
                  exit 1
                }
              }
              run mc alias set local http://rustfs.default.svc.cluster.local:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              run mc stat local/assets
              run mc admin user svcacct add local "$RUSTFS_ACCESS_KEY" --access-key "$S3_ACCESS_KEY" --secret-key "$S3_SECRET_KEY" --policy /policy/policy.json
              echo 'Scoped assets service account created'
          envFrom:
            - secretRef: {name: rustfs-credentials}
            - secretRef: {name: asset-manager-credentials}
          volumeMounts: [{name: policy, mountPath: /policy, readOnly: true}]
      volumes:
        - name: policy
          configMap: {name: asset-manager-s3-policy}




